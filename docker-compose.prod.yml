version: '3.8'

services:
  ebz-db:
    image: postgres:16-alpine
    container_name: ebz-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-eotinish_platform}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-eotinish_ai_demo}
    volumes:
      - ebz_pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-eotinish_platform} -d ${DB_NAME:-eotinish_ai_demo}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ebz-internal

  ebz-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ebz-router:latest
    container_name: ebz-web-prod
    restart: always
    depends_on:
      ebz-db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3050}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-eotinish_platform}:${DB_PASSWORD:?Set DB_PASSWORD in .env}@ebz-db:5432/${DB_NAME:-eotinish_ai_demo}
      SITE_GATE_PASSWORD: ${SITE_GATE_PASSWORD:?Set SITE_GATE_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env (openssl rand -hex 32)}
      EBZ_PRESET_USERS: ${EBZ_PRESET_USERS:?Set EBZ_PRESET_USERS in .env (see scripts/hash_password.mjs)}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      AI_GATEWAY_URL: ${AI_GATEWAY_URL:-http://localhost:11434}
      NEXT_TELEMETRY_DISABLED: 1
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q '\"status\":\"pass\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - ebz-internal

volumes:
  ebz_pgdata:
    driver: local

networks:
  ebz-internal:
    driver: bridge
