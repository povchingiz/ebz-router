stages: [lint, test, build]

default:
  image: node:20-alpine

lint:
  stage: lint
  script:
    - npm ci
    - npm run lint

test:
  stage: test
  script:
    - npm ci
    - npx vitest run tests/e2e/api/audit_logging.test.ts tests/e2e/api/concurrency_locking.test.ts

docker-build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  script:
    - docker build -t ebz-router:$CI_COMMIT_SHORT_SHA .
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG'
